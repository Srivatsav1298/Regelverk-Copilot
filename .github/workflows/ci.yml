name: quality

on:
  push:
  pull_request:
  schedule:
    - cron: "17 5 * * 1"

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python -m compileall -q app data eval tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package.json }
      - working-directory: frontend
        run: npm install --no-audit --no-fund
      - working-directory: frontend
        run: npm run typecheck
      - working-directory: frontend
        run: npm run build

  source-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python scripts/check_source_registry.py
      - run: python scripts/snapshot_official_sources.py
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-source-candidates
          path: data/source_candidates/
          if-no-files-found: ignore
      - run: python scripts/check_source_freshness.py
